
services:
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-development}

    container_name: nuxt-app
    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      CHOKIDAR_USEPOLLING: "true"

    volumes:
      - .:/app
      - nuxt_node_modules:/app/node_modules
      - nuxt_cache:/app/.nuxt

volumes:
  nuxt_node_modules:
  nuxt_cache:
